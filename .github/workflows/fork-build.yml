# Builds this fork's image: nicholas-fedor/watchtower's latest release with the
# per-container-schedule branch on top, tested, pushed to ghcr.io. When the
# feature needs upstream changes newer than the release, it is built on
# upstream's main instead (the image tag says which).
#
# Nothing is pushed to the repository: the feature is rebased onto the release
# inside the runner. When it no longer applies cleanly, or the tests fail, an
# issue labeled "sync-conflict" is opened (or updated) and assigned to the
# owner; a later successful build closes it.
name: Fork build

on:
  schedule:
    - cron: "17 9 * * *" # daily: picks up a new upstream release
  push:
    branches: [fork] # (a push to the feature branch runs upstream's own checks; this runs daily or by hand)
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this release and feature were built before
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: fork-build
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/nicholas-fedor/watchtower.git
  FEATURE: per-container-schedule
  IMAGE: ghcr.io/${{ github.repository_owner }}/watchtower
  ALERT_LABEL: sync-conflict

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the feature
        uses: actions/checkout@v5
        with:
          ref: ${{ env.FEATURE }}
          fetch-depth: 0

      - name: Choose the base (upstream's latest release, else its main)
        id: base
        run: |
          git config user.name "fork-build"
          git config user.email "fork-build@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --tags upstream main
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          feature=$(git rev-parse --short=7 HEAD)
          fork_point=$(git merge-base HEAD upstream/main)
          # Does the feature apply to the release? (tried on a scratch branch)
          git checkout --quiet -b probe HEAD
          if git rebase --quiet --onto "$tag" "$fork_point" > /dev/null 2>&1; then
            base="$tag"
            key="${tag}-schedules.${feature}"
          else
            git rebase --abort > /dev/null 2>&1 || true
            main=$(git rev-parse --short=7 upstream/main)
            base="upstream/main"
            key="${tag}-main.${main}-schedules.${feature}"
            echo "The feature needs upstream changes newer than $tag: building on main ($main)." >> "$GITHUB_STEP_SUMMARY"
          fi
          git checkout --quiet "$FEATURE"
          git branch --quiet -D probe
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "fork_point=$fork_point" >> "$GITHUB_OUTPUT"
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Base $base, feature $feature: image tag $key" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip if already built
        id: built
        if: inputs.force != true
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.base.outputs.key }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built: nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebase the feature onto the base
        id: rebase
        if: steps.built.outputs.skip != 'true'
        run: |
          if ! git rebase --onto "${{ steps.base.outputs.base }}" "${{ steps.base.outputs.fork_point }}" > rebase.log 2>&1; then
            git diff --name-only --diff-filter=U > conflicts.txt || true
            git rebase --abort || true
            echo "stage=rebase" >> "$GITHUB_OUTPUT"
            cat rebase.log
            exit 1
          fi
          git log --oneline "${{ steps.base.outputs.base }}..HEAD"

      - name: Set up Go
        if: steps.built.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        id: test
        if: steps.built.outputs.skip != 'true'
        run: |
          set -o pipefail
          echo "stage=test" >> "$GITHUB_OUTPUT"
          go test -timeout 20m ./... 2>&1 | tee test.log
          go test -race -timeout 10m ./internal/update/schedule/... 2>&1 | tee -a test.log
          echo "stage=" >> "$GITHUB_OUTPUT"

      # Upstream's own quality and security checks, on the code being shipped:
      # its linter and config, govulncheck, and gosec. Upstream runs gosec in
      # report-only mode and has findings of its own, so only findings in files
      # this fork changes fail the build; the rest are listed in the summary.
      - name: Lint (upstream's golangci-lint config)
        id: lint
        if: steps.built.outputs.skip != 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m --config=build/golangci-lint/golangci-lint.yaml

      - name: Check for known vulnerabilities (govulncheck)
        id: vuln
        if: steps.built.outputs.skip != 'true'
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1 | tee vuln.log

      - name: Security scan (gosec)
        id: gosec
        if: steps.built.outputs.skip != 'true'
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude-generated -no-fail -fmt=json -out gosec.json ./... || true
          # The lines this fork adds: only findings on them stop the build.
          git diff --unified=0 "${{ steps.base.outputs.base }}..HEAD" -- '*.go' > added.diff
          python3 - <<'PY'
          import json, os, re
          root = os.getcwd() + "/"
          added, current = {}, None
          for line in open("added.diff"):
              if line.startswith("+++ "):
                  current = line[6:].strip() if line.startswith("+++ b/") else None
              elif line.startswith("@@") and current:
                  start, _, count = re.match(r"@@ -\S+ \+(\d+)(,(\d+))? @@", line).groups()
                  n = 1 if count is None else int(count)
                  added.setdefault(current, set()).update(range(int(start), int(start) + n))
          findings = json.load(open("gosec.json")).get("Issues") or []
          def place(f):
              return f["file"].replace(root, ""), int(str(f["line"]).split("-")[0])
          ours = [f for f in findings if place(f)[1] in added.get(place(f)[0], ())]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"gosec: {len(ours)} finding(s) on lines this fork adds, "
                            f"{len(findings) - len(ours)} in upstream's code (report only).\n")
          with open("gosec-ours.txt", "w") as out:
              for f in ours:
                  path, line = place(f)
                  print(f"::error file={path},line={line}::gosec {f['rule_id']}: {f['details']}")
                  out.write(f"{path}:{line} {f['rule_id']} {f['details']}\n")
          raise SystemExit(1 if ours else 0)
          PY

      - name: Build the binaries
        if: steps.built.outputs.skip != 'true'
        run: |
          version="${{ steps.base.outputs.key }}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/nicholas-fedor/watchtower/internal/meta.Version=$version" \
              -o "dist/linux/$arch/watchtower" .
          done

      - name: Set up Docker Buildx
        if: steps.built.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.built.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.built.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.base.outputs.key }}
          # com.centurylinklabs.watchtower=true is how Watchtower knows its own
          # container: without it a self-update stops itself as if it were any
          # other container and nothing starts the new one (upstream sets it in
          # its release Dockerfiles, not in build/docker/Dockerfile)
          labels: |
            com.centurylinklabs.watchtower=true
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.base.outputs.feature }}
            org.opencontainers.image.version=${{ steps.base.outputs.key }}
            org.opencontainers.image.description=Watchtower (${{ steps.base.outputs.base }}) with per-container schedules

      - name: Close the alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Fixed: built ${{ steps.base.outputs.key }} in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: Raise the alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.base.outputs.base }}
          STAGE: >-
            ${{ steps.rebase.outputs.stage || steps.test.outputs.stage
            || (steps.lint.outcome == 'failure' && 'lint')
            || (steps.vuln.outcome == 'failure' && 'vulnerability check')
            || (steps.gosec.outcome == 'failure' && 'security scan') || 'build' }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The fork build failed at the **$STAGE** stage, building \`$FEATURE\` on upstream **$TAG**."
            echo
            if [ "$STAGE" = rebase ] && [ -s conflicts.txt ]; then
              echo "Files in conflict:"
              echo
              sed 's/^/- `/; s/$/`/' conflicts.txt
              echo
            fi
            if [ "$STAGE" = "vulnerability check" ] && [ -s vuln.log ]; then
              echo "Vulnerabilities the code calls:"
              echo
              echo '```'
              grep -E '^(Vulnerability|  [A-Z])' vuln.log | head -40
              echo '```'
              echo
            fi
            if [ "$STAGE" = "security scan" ] && [ -s gosec-ours.txt ]; then
              echo "gosec findings in this fork's files:"
              echo
              echo '```'
              cat gosec-ours.txt
              echo '```'
              echo
            fi
            if [ "$STAGE" = lint ]; then
              echo "The linter's findings are in the run's annotations."
              echo
            fi
            if [ "$STAGE" = test ] && [ -s test.log ]; then
              echo "Failures:"
              echo
              echo '```'
              grep -E -- '^(--- FAIL|FAIL|panic:)' test.log | head -40
              echo '```'
              echo
            fi
            echo "Run: $run_url"
            echo
            echo "To reproduce:"
            echo
            echo '```sh'
            echo "git fetch upstream --tags && git checkout $FEATURE"
            echo "git rebase --onto $TAG \$(git merge-base HEAD upstream/main)"
            echo "go test ./..."
            echo '```'
            echo
            echo "Until it's fixed, the last good image stays on ghcr.io. This issue closes itself after the next successful build."
          } > alert.md
          gh label create "$ALERT_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The fork build can't apply or test the feature on upstream" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file alert.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "Fork build failed ($STAGE): $FEATURE on $TAG" --body-file alert.md
          fi
